<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>Cefiro - Ficha de personaje</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Almendra+SC&family=IM+Fell+English:ital@0;1&display=swap"
        rel="stylesheet">
</head>

<body>
    <div class="container">
        <!-- Cabecera con foto y datos básicos -->
        <div class="header">
            <div class="foto">
                <div class="foto-placeholder">📷</div>
            </div>
            <div class="info">
                <input type="text" id="nombre" class="nombre-input" placeholder="Nombre" value="Paxo">
                <div class="detalles">
                    <input type="text" id="raza" placeholder="Raza" value="Tabaxi">
                    <input type="text" id="clase" placeholder="Clase" value="Hechicero">
                    <input type="text" id="subclase" placeholder="Subclase" value="Dracónico">
                    <span>Nvl <input type="number" id="nivel" value="3" min="1" max="20" style="width: 60px;"></span>
                    <input type="text" id="alineamiento" placeholder="Alineamiento" value="NB">
                </div>
            </div>
        </div>

        <!-- Slider / Pestañas -->
        <div class="tabs">
            <input type="radio" name="tabs" id="tab-principal" checked>
            <label for="tab-principal">Principal</label>

            <input type="radio" name="tabs" id="tab-notas">
            <label for="tab-notas">Notas</label>

            <input type="radio" name="tabs" id="tab-rasgos">
            <label for="tab-rasgos">Rasgos</label>

            <input type="radio" name="tabs" id="tab-objetos">
            <label for="tab-objetos">Objetos</label>

            <input type="radio" name="tabs" id="tab-ataques">
            <label for="tab-ataques">Ataques</label>

            <input type="radio" name="tabs" id="tab-magia">
            <label for="tab-magia">Magia</label>

            <input type="radio" name="tabs" id="tab-trasfondo">
            <label for="tab-trasfondo">Trasfondo</label>

            <div class="tab-content">
                <!-- SECCIÓN PRINCIPAL: Stats, salvaciones, habilidades -->
                <div class="tab-panel" id="content-principal">
                    <div class="ficha-grid">
                        <!-- Columna izquierda -->
                        <div class="ficha-columna">
                            <h2>Características</h2>
                            <div class="stats-grid">
                                <div class="stat-item">
                                    <span class="stat-label">FUE</span>
                                    <input type="number" id="fue" class="stat-value" value="10" min="1" max="30">
                                    <span class="stat-mod" id="mod-fue">(0)</span>
                                </div>
                                <div class="stat-item">
                                    <span class="stat-label">DES</span>
                                    <input type="number" id="des" class="stat-value" value="10" min="1" max="30">
                                    <span class="stat-mod" id="mod-des">(0)</span>
                                </div>
                                <div class="stat-item">
                                    <span class="stat-label">CON</span>
                                    <input type="number" id="con" class="stat-value" value="10" min="1" max="30">
                                    <span class="stat-mod" id="mod-con">(0)</span>
                                </div>
                                <div class="stat-item">
                                    <span class="stat-label">INT</span>
                                    <input type="number" id="int" class="stat-value" value="10" min="1" max="30">
                                    <span class="stat-mod" id="mod-int">(0)</span>
                                </div>
                                <div class="stat-item">
                                    <span class="stat-label">SAB</span>
                                    <input type="number" id="sab" class="stat-value" value="10" min="1" max="30">
                                    <span class="stat-mod" id="mod-sab">(0)</span>
                                </div>
                                <div class="stat-item">
                                    <span class="stat-label">CAR</span>
                                    <input type="number" id="car" class="stat-value" value="10" min="1" max="30">
                                    <span class="stat-mod" id="mod-car">(0)</span>
                                </div>
                            </div>

                            <h2>Tiradas de salvación</h2>
                            <div class="saving-throws-grid">
                                <div class="saving-item">
                                    <span class="saving-label">FUE</span>
                                    <span class="saving-mod" id="save-fue">0</span>
                                    <input type="checkbox" id="prof-save-fue" class="prof-check">
                                </div>
                                <div class="saving-item">
                                    <span class="saving-label">DES</span>
                                    <span class="saving-mod" id="save-des">0</span>
                                    <input type="checkbox" id="prof-save-des" class="prof-check">
                                </div>
                                <div class="saving-item">
                                    <span class="saving-label">CON</span>
                                    <span class="saving-mod" id="save-con">0</span>
                                    <input type="checkbox" id="prof-save-con" class="prof-check">
                                </div>
                                <div class="saving-item">
                                    <span class="saving-label">INT</span>
                                    <span class="saving-mod" id="save-int">0</span>
                                    <input type="checkbox" id="prof-save-int" class="prof-check">
                                </div>
                                <div class="saving-item">
                                    <span class="saving-label">SAB</span>
                                    <span class="saving-mod" id="save-sab">0</span>
                                    <input type="checkbox" id="prof-save-sab" class="prof-check">
                                </div>
                                <div class="saving-item">
                                    <span class="saving-label">CAR</span>
                                    <span class="saving-mod" id="save-car">0</span>
                                    <input type="checkbox" id="prof-save-car" class="prof-check">
                                </div>
                            </div>

                            <div class="hp-armor">
                                <div class="hp-box">
                                    <span class="hp-label">PG</span>
                                    <input type="number" id="pg_actuales" value="10" min="0" class="hp-input"
                                        style="width: 60px;">
                                    <span style="margin: 0 5px;">/</span>
                                    <input type="number" id="pg_max" value="10" min="1" class="hp-input"
                                        style="width: 60px;">
                                </div>
                                <div class="armor-box">
                                    <span class="armor-label">CA</span>
                                    <input type="number" id="ca" value="10" min="0" class="armor-input"
                                        style="width: 60px;">
                                </div>
                            </div>

                            <div class="proficiency-box">
                                <span class="prof-label">Bonificador por competencia</span>
                                <span id="prof-bonus" class="prof-value">+2</span>
                            </div>
                        </div>

                        <!-- Columna derecha -->
                        <div class="ficha-columna">
                            <h2>Habilidades</h2>
                            <div class="skills-list" id="skills-list"></div>
                        </div>
                    </div>
                </div>

                <!-- SECCIÓN NOTAS -->
                <div class="tab-panel" id="content-notas">
                    <h2>Notas de campaña</h2>
                    <textarea id="notas" placeholder="Escribe aquí tus notas de la campaña..."></textarea>
                </div>

                <!-- SECCIÓN RASGOS -->
                <div class="tab-panel" id="content-rasgos">
                    <h2>Rasgos</h2>
                    <textarea id="rasgos" placeholder="Rasgos de clase, raciales, etc."
                        style="height: 300px;"></textarea>
                </div>

                <!-- SECCIÓN OBJETOS -->
                <div class="tab-panel" id="content-objetos">
                    <h2>Objetos</h2>
                    <textarea id="objetos" placeholder="Lista de objetos" style="height: 300px;"></textarea>
                </div>

                <!-- SECCIÓN ATAQUES -->
                <div class="tab-panel" id="content-ataques">
                    <h2>Ataques</h2>
                    <textarea id="ataques" placeholder="Lista de ataques" style="height: 300px;"></textarea>
                </div>

                <!-- SECCIÓN MAGIA -->
                <div class="tab-panel" id="content-magia">
                    <h2>Conjuros</h2>
                    <textarea id="magia" placeholder="Conjuros conocidos" style="height: 300px;"></textarea>
                </div>

                <!-- SECCIÓN TRASFONDO -->
                <div class="tab-panel" id="content-trasfondo">
                    <h2>Trasfondo</h2>
                    <textarea id="trasfondo" placeholder="Historia, ideales, vínculos, defectos"
                        style="height: 300px;"></textarea>
                </div>
            </div>
        </div>

        <!-- Botones de acción -->
        <div style="display: flex; gap: 10px; margin-top: 20px;">
            <button id="guardarBtn" class="btn-accion">💾 Guardar</button>
            <button id="exportarBtn" class="btn-accion">📤 Exportar</button>
            <button id="importarBtn" class="btn-accion">📂 Importar</button>
            <button onclick="window.location.href='index.html'" class="btn-accion">🏠 Inicio</button>
        </div>
        <div id="mensaje" class="mensaje"></div>
    </div>

    <script src="../core/personaje.js"></script>
    <script src="../sistemas/dnd5e/adaptador-5ecompanion.js"></script>
    <script src="../sistemas/dnd5e/data-loader.js"></script>
    <script src="script.js"></script>
</body>

</html>
